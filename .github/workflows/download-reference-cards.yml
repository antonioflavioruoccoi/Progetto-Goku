name: Download Pokemon card scans and prices

on:
  push:
    branches: [feat/50-pokemon-card-images]
    paths:
      - 'data/pokemon-cards-100-500.csv'
      - 'scripts/download_reference_cards.py'
      - 'scripts/export_cardmarket_30d.py'
      - '.github/workflows/download-reference-cards.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Export Cardmarket 30-day averages
        run: python scripts/export_cardmarket_30d.py
      - name: Commit CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pokemon-cards-30d-avg-cardmarket.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update Cardmarket 30-day card price averages"
            git push
          fi
